// ============================================================================
// BetterRCS_RO - Realism Overhaul compatibility patch for BetterRCS
//
// Makes RO's Waterfall RCS configs (ROWaterfall) use the BetterRCS plume
// templates and controller set instead of the stock RO plumes.
//
// Part of:  https://github.com/gyxx-xc/BetterRCS_RO
// Requires: ModuleManager, Waterfall, Realism Overhaul, BetterRCS
// License:  MIT
// ============================================================================

// RO config RCS is a bit larger then ours, so give it a global scale up. For others, RO config work quite good.
@PART[*]:HAS[@ROWaterfall:HAS[#autoConfig[rcs]],!MODULE[BetterRCSDisabledTag]]:AFTER[ROWaterfall]:NEEDS[Waterfall]
{
    @ROWaterfall
    {
        @scale[*] *= 1.2
    }
}

// nesdIR-GM, nesdIRhl*, nesdIRml*, TE_* are not supported with RO.

// we setup BetterRCSDisabledTag here, if part got this tag, it will use the RO original config.
@PART[*]:HAS[@ROWaterfall:HAS[#autoConfig[rcs]],!MODULE[BetterRCSDisabledTag]]:AFTER[zROWaterfall_15_AutoConfig]:NEEDS[Waterfall]
{
    @ROWaterfall
    {
        %template = BetterRCS_LowVacSLPressure
        %defaultMainPlumeVariantName = lowvacsl

        %MainPlumeVariant[lowsl]:NEEDS[B9PartSwitch]
        {
            %template = BetterRCS_LowSLPressure
        }
        %MainPlumeVariant[lowvac]:NEEDS[B9PartSwitch]
        {
            %template = BetterRCS_LowVacPressure
        }
        %MainPlumeVariant[base]:NEEDS[B9PartSwitch]
        {
            %template = BetterRCS_Base
        }

        %MainPlumeVariant[hydrolox]:NEEDS[B9PartSwitch]
        {
            %template = BetterRCS_Hydrolox
        }
        %MainPlumeVariant[methalox]:NEEDS[B9PartSwitch]
        {
            %template = BetterRCS_Methalox
        }
    }

    @MODULE[Module*EngineConfigs]:HAS[#type[ModuleRCS]]:NEEDS[B9PartSwitch]
    {
        @CONFIG[Helium]
        {
            %rowaterfallVariant = lowvac
        }
        @CONFIG[Hydrazine]
        {
            %rowaterfallVariant = lowsl
        }
        @CONFIG[NitrousOxide]
        {
            %rowaterfallVariant = lowsl
        }

        @CONFIG[MMH+MON3]
        {
            %rowaterfallVariant = base
        }
        @CONFIG[MMH+MON10]
        {
            %rowaterfallVariant = base
        }
        @CONFIG[*+NTO],*
        {
            %rowaterfallVariant = base
        }

        @CONFIG[RP-1+O2]
        {
            %rowaterfallVariant = base
        }
        @CONFIG[Syntin+O2]
        {
            %rowaterfallVariant = base
        }
        @CONFIG[Ethanol+O2]
        {
            %rowaterfallVariant = base
        }

        @CONFIG[CH4+O2]
        {
            %rowaterfallVariant = methalox
        }
        @CONFIG[H2+O2]
        {
            %rowaterfallVariant = hydrolox
        }

        @CONFIG[Cavea-B]
        {
            %rowaterfallVariant = base
        }
        @CONFIG[ASCENT]
        {
            %rowaterfallVariant = base
        }
        // Using default cold-gas: Nitrogen, HTP.
    }
}

@PART[*]:HAS[@ROWaterfall]:BEFORE[zROWaterfall_90_Controllers]:NEEDS[Waterfall]
{
    @ROWaterfall:HAS[#template[BetterRCS_*]] { &controllerSet = betterrcs }
}

@PART:HAS[@ROWaterfall:HAS[#controllerSet[betterrcs]]]:FOR[zROWaterfall_90_Controllers]:NEEDS[Waterfall]
{
    @MODULE[ModuleWaterfallFX]:HAS[#__rowaterfall]
    {
        ATMOSPHEREDENSITYCONTROLLER
        {
            name = atmosphereDepth
        }
        RCSCONTROLLER
        {
            responseRateUp = 1200
            // I set rate down a lower number here to make it has a feeling of the remaining gas
            responseRateDown = 20
            thrusterTransformName = #$/ROWaterfall/transform$
            name = rcs
        }
    }
}
